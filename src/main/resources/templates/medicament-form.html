<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulaire médicament</title>
</head>
<body>
<h1 th:text="${medicament.id == null ? 'Ajouter un médicament' : 'Modifier un médicament'}"></h1>

<form th:action="@{/admin/medicaments/save}" method="post" th:object="${medicament}">

    <!-- Champ caché pour l'ID (null en mode ajout) -->
    <input type="hidden" th:field="*{id}"/>

    <div>
        <label>Nom :</label>
        <input type="text" th:field="*{nom}" required/>
    </div>
    <div>
        <label>Description :</label>
        <input type="text" th:field="*{description}"/>
    </div>
    <div>
        <label>Prix (MAD) :</label>
        <input type="number" step="0.01" th:field="*{prix}" required/>
    </div>
    <div>
        <label>Stock :</label>
        <input type="number" th:field="*{stock}" required/>
    </div>

    <br/>
    <button type="submit">Enregistrer</button>
    <a th:href="@{/admin/medicaments}">Annuler</a>
</form>
</body>
</html>
