<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Espace Caissier - Ventes</title>
    <style>
        .error { color: red; font-weight: bold; }
        .success { color: green; font-weight: bold; }
    </style>
</head>
<body>

<h1>Espace Caissier : Enregistrer une vente</h1>

<!-- Messages d'erreur ou de succès -->
<div th:if="${error}" class="error"><p th:text="${error}"></p></div>
<div th:if="${success}" class="success"><p th:text="${success}"></p></div>

<!-- Formulaire de vente -->
<form th:action="@{/caissier/ventes}" method="post">
    <div>
        <label>Médicament :</label>
        <select name="medicamentId" required>
            <option value="">-- Choisir un médicament --</option>
            <option th:each="med : ${medicaments}"
                    th:value="${med.id}"
                    th:text="${med.nom} + ' (Stock: ' + ${med.stock} + ') - ' + ${med.prix} + ' DH'">
            </option>
        </select>
    </div>
    <br>
    <div>
        <label>Quantité vendue :</label>
        <input type="number" name="quantite" min="1" required />
    </div>
    <br>
    <button type="submit">Valider la vente</button>
</form>

<br><br>
<a th:href="@{/home}">Retour à l'accueil</a>

</body>
</html>
